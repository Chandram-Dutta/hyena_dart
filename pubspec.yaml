name: hyena_dart
description: A Flutter/Dart codebase analyzer for dead code detection and complexity metrics.
version: 3.0.0
repository: https://github.com/Chandram-Dutta/hyena_dart
issue_tracker: https://github.com/Chandram-Dutta/hyena_dart/issues

topics:
  - analyzer
  - dead-code
  - complexity
  - linter
  - cli

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.0.0
  args: ^2.4.0
  dart_mcp: ^0.5.2
  path: ^1.9.0
  yaml: ^3.1.0
  glob: ^2.1.1

dev_dependencies:
  # Not used directly: keeps `dart pub downgrade` from selecting
  # frontend_server_client 3.x, which cannot start the test runner on
  # current SDKs.
  frontend_server_client: ^4.0.0
  lints: ^6.0.0
  test: ^1.25.6
