name: hyena_dart
description: A Flutter/Dart codebase analyzer for dead code detection and complexity metrics.
version: 1.1.1
repository: https://github.com/Chandram-Dutta/hyena_dart
issue_tracker: https://github.com/Chandram-Dutta/hyena_dart/issues

topics:
  - analyzer
  - dead-code
  - complexity
  - linter
  - cli

executables:
  hyena_dart:

environment:
  sdk: ^3.10.3

dependencies:
  analyzer: ^7.7.1
  args: ^2.4.0
  path: ^1.9.0
  yaml: ^3.1.0
  glob: ^2.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
