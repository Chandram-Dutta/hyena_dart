name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sdk: 3.10.3
          - os: ubuntu-latest
            sdk: stable
          - os: macos-latest
            sdk: stable
          - os: windows-latest
            sdk: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart run tool/check_version.dart
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  lower-bounds:
    name: Test lower dependency bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub downgrade
      - run: dart run tool/check_version.dart
      - run: dart analyze --fatal-infos
      - run: dart run bin/hyena_dart.dart analyze lib --format=json --output=/tmp/hyena-lower-bounds.json
      - run: dart run bin/hyena_mcp.dart --help
