name: Performance benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
      samples:
        description: Measured samples per benchmark
        required: true
        default: '3'
        type: choice
        options:
          - '3'
          - '5'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run ${{ inputs.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_SUITE: ${{ inputs.suite }}
      BENCHMARK_SAMPLES: ${{ inputs.samples }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Run deterministic benchmarks
        shell: bash
        run: |
          dart run benchmark/benchmark.dart \
            --suite="$BENCHMARK_SUITE" \
            --samples="$BENCHMARK_SAMPLES" \
            --warmups=1 \
            --baseline=benchmark/results/v1.2.1.json \
            --output=benchmark-results.json | tee benchmark-summary.txt
          {
            echo '## Hyena Dart performance benchmarks'
            echo
            echo '```text'
            cat benchmark-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hyena-${{ inputs.suite }}-benchmark-${{ github.sha }}
          path: |
            benchmark-results.json
            benchmark-summary.txt
          if-no-files-found: error
          retention-days: 30
