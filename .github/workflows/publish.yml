name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml)"
          if [[ -z "$package_version" || "v$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $package_version"
            exit 1
          fi
      - run: dart pub get
      - run: dart run tool/check_version.dart
      - name: Verify CHANGELOG release notes
        shell: bash
        run: dart run tool/release_notes.dart "${GITHUB_REF_NAME#v}" > /dev/null
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  publish:
    name: Publish package
    needs: verify
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: pub.dev

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check for existing release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.exists != 'true'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - if: steps.existing.outputs.exists != 'true'
        run: dart pub get
      - name: Create release from CHANGELOG
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dart run tool/release_notes.dart "$version" > release-notes.md
          printf '\nPublished to pub.dev: https://pub.dev/packages/hyena_dart/versions/%s\n' "$version" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Hyena Dart $GITHUB_REF_NAME" --notes-file release-notes.md
